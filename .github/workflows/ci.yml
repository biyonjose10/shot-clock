name: checks

# The suite is deliberately offline: no Grafana, no Gemini, no secrets. It
# covers the four things that have actually broken this project -- a costing
# that did not add up, a journal that lost its place, a quota ledger that lied,
# and a trace whose children outlasted their parent.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest tests/ -q
      - name: The simulator runs with no credentials at all
        run: python -m sim.main --dry-run --duration 5
